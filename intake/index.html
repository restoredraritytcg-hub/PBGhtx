<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>PBG Card Intake</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<script src="../pbg-config.js"></script>
<script src="../pbg-api.js"></script>
<script src="cardsearch.js"></script>
<script src="rr-push.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#141414;--navy-2:#2A2A2A;--red:#E31B23;--paper:#F5F6F3;--white:#fff;
  --steel:#6C778A;--line:#D5D9E0;--green:#1F8A4C;--amber:#B7791F;--wide:"wdth" 118;--narrow:"wdth" 72;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--navy);font-family:Archivo,system-ui,sans-serif;font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1,h2,h3{margin:0;line-height:1.1;font-variation-settings:var(--wide);font-style:italic;font-weight:900}
h1{font-size:40px;font-weight:850}
h2{font-size:30px;font-weight:800}
h3{font-size:20px;font-weight:750}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}

.bar{background:#000;color:#fff;display:flex;align-items:center;gap:20px;padding:0 24px;height:68px;position:sticky;top:0;z-index:10}
.bar .mark{font-weight:900;font-size:24px;font-variation-settings:"wdth" 125;letter-spacing:.02em}
.bar .sub{font-size:15px;opacity:.75;font-variation-settings:var(--narrow)}
.bar .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.pill{font-size:14px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12)}
.pill.warn{background:#F6E0B5;color:#5A3A00}
.icon-btn{width:48px;height:48px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer}

.steps{display:flex;gap:6px;padding:16px 24px 0;max-width:1100px;margin:0 auto}
.steps div{flex:1;font-size:15px;color:var(--steel);border-top:4px solid var(--line);padding-top:8px}
.steps div.on{color:var(--navy);border-color:var(--red);font-weight:700}
.steps div.done{color:var(--navy);border-color:var(--navy)}

main{max-width:1100px;margin:0 auto;padding:24px 24px 140px}
.screen-head{margin:12px 0 24px}
.screen-head p{color:var(--steel);margin-top:8px}

.panel{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
label.f{display:block;font-size:15px;color:var(--steel);font-weight:600}
label.f .req{color:var(--red)}
input.t,select.t,textarea.t{display:block;width:100%;margin-top:6px;min-height:54px;padding:12px 14px;font-size:18px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--navy)}
textarea.t{min-height:120px;resize:vertical}
input.t:focus,select.t:focus,textarea.t:focus{border-color:var(--navy);outline:none}
input.t.bad{border-color:var(--red)}
.err{color:var(--red);font-size:15px;margin-top:6px}

.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.seg button{min-height:52px;padding:0 18px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{border-color:var(--navy);background:var(--navy);color:#fff}

.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.choice{text-align:left;padding:18px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;min-height:92px}
.choice b{display:block;font-size:20px;font-variation-settings:var(--wide)}
.choice span{display:block;color:var(--steel);font-size:15px;margin-top:4px}
.choice[aria-pressed=true]{border-color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.choice .price{color:var(--navy);font-weight:800;font-size:22px;margin-top:8px}
.choice.paused{opacity:.45;cursor:not-allowed;background:#EEE;border-style:dashed}
.choice.paused .price{text-decoration:line-through}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 26px;border-radius:999px;border:2px solid transparent;font-weight:750;font-size:18px;cursor:pointer;text-decoration:none}
.btn-red{background:var(--red);color:#fff}
.btn-navy{background:var(--navy);color:#fff}
.btn-line{border-color:var(--navy);background:#fff;color:var(--navy)}
.btn-ghost{background:transparent;color:var(--navy)}
.btn-sm{min-height:44px;padding:0 16px;font-size:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 24px calc(14px + env(safe-area-inset-bottom));z-index:9}
.foot .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.foot .sum{margin-right:auto;font-size:16px;color:var(--steel)}
.foot .sum b{color:var(--navy);font-size:22px}

/* welcome */
.welcome{background:radial-gradient(90% 60% at 50% 100%,rgba(227,27,35,.12),transparent 70%);min-height:calc(100vh - 68px);display:grid;place-items:center;text-align:center;padding:40px 24px}
.welcome h1{font-size:clamp(40px,6vw,64px)}
.welcome p{color:var(--steel);font-size:21px;max-width:32em;margin:18px auto 0}
.welcome .btn{margin-top:40px;min-height:72px;font-size:22px;padding:0 44px}
.welcome .partner{margin-top:48px;font-size:16px;color:var(--steel)}
.svc{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:36px}
.svc div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;text-align:left;width:250px}
.svc b{display:block}
.svc span{color:var(--steel);font-size:15px}

/* cards */
.cardrow{display:grid;grid-template-columns:88px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.cardrow:first-child{border-top:0}
.thumb{width:88px;height:120px;border-radius:8px;background:#E7EBF2 center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--steel);font-size:13px}
.cardrow .meta{font-size:15px;color:var(--steel)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:#ECECEC;color:#333}
.tag.rr{background:#FBE6E9;color:#8E1423}
.tag.warn{background:#FCEFD6;color:#7A4D00}
.empty{text-align:center;padding:40px 20px;color:var(--steel)}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.bulk span{color:var(--steel);font-size:15px;margin-right:4px}

.toggle{display:flex;align-items:flex-start;gap:14px;padding:16px;border:2px solid var(--line);border-radius:14px;cursor:pointer;background:#fff}
.toggle input{width:26px;height:26px;margin:2px 0 0;accent-color:var(--navy);flex:none}
.toggle b{display:block}
.toggle span{display:block;color:var(--steel);font-size:15px}
.toggle:has(input:checked){border-color:var(--navy)}
.toggle .amt{margin-left:auto;font-weight:800;white-space:nowrap}

.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:440px}
.photo{position:relative;aspect-ratio:5/7;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;color:var(--steel);cursor:pointer;background:#FAFBFC center/contain no-repeat;font-size:15px;padding:10px}
.photo.has{border-style:solid;border-color:var(--navy)}
.photo.has span{display:none}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* review */
table.sum{width:100%;border-collapse:collapse;font-size:16px}
table.sum th{text-align:left;color:var(--steel);font-weight:600;padding:8px 8px;border-bottom:2px solid var(--navy);font-size:14px}
table.sum td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.sum td.n,table.sum th.n{text-align:right;white-space:nowrap}
.totals{margin-left:auto;width:min(380px,100%);margin-top:16px}
.totals div{display:flex;justify-content:space-between;padding:6px 0}
.totals .grand{border-top:2px solid var(--navy);margin-top:6px;padding-top:12px;font-size:24px;font-weight:850}
.terms{font-size:15px;color:#3C4659;background:var(--paper);border-radius:12px;padding:16px;max-height:220px;overflow:auto;white-space:pre-wrap}
.sig{position:relative;margin-top:8px}
.sig canvas{width:100%;height:180px;border:2px solid var(--line);border-radius:12px;background:#fff;touch-action:none;display:block}
.sig .clear{position:absolute;right:10px;top:10px}
.sig .hint{position:absolute;left:16px;bottom:14px;color:#A3ABB9;font-size:15px;pointer-events:none;border-top:1px solid #C9CFDA;right:16px;padding-top:6px}

/* done */
.ticket{text-align:center;padding:40px 24px}
.ticket .num{font-size:clamp(44px,8vw,80px);font-weight:900;font-variation-settings:"wdth" 80;letter-spacing:.02em;margin:10px 0}
.ticket p{color:var(--steel)}
.sync{display:inline-flex;gap:8px;align-items:center;font-size:15px;margin-top:14px;padding:6px 14px;border-radius:999px;background:#ECECEC}
.sync.ok{background:#DDF1E4;color:#14532D}.sync.wait{background:#FCEFD6;color:#7A4D00}

/* staff */
.tabs{display:flex;gap:8px;margin-bottom:20px}
.list .row{display:grid;grid-template-columns:1.2fr 1.4fr .6fr .7fr auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line);font-size:16px}
.list .row.h{color:var(--steel);font-size:14px;border-top:0}
@media (max-width:760px){.list .row{grid-template-columns:1fr 1fr}}
.notice{background:#FCEFD6;color:#5A3A00;border-radius:12px;padding:14px 16px;font-size:15px;margin-bottom:16px}
.tierline{display:grid;grid-template-columns:1.2fr 1.6fr .8fr .8fr auto auto;gap:8px;align-items:end;margin-top:8px}
.tierline input.t{min-height:46px;font-size:16px;padding:8px 10px}
.grader-block{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(19,37,75,.45);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:18px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:28px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;flex-wrap:wrap}
.pinpad{display:grid;grid-template-columns:repeat(3,84px);gap:10px;justify-content:center;margin-top:20px}
.pinpad button{height:72px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:26px;font-weight:700;cursor:pointer}
.pindots{display:flex;justify-content:center;gap:12px;margin-top:16px}
.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--navy)}
.pindots i.f{background:var(--navy)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;z-index:60;font-size:16px}

/* print receipt */
#print{display:none}
@media print{
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block;font-size:12pt;color:#000;padding:0}
  #print h1{font-size:20pt}
  #print table{width:100%;border-collapse:collapse;margin-top:10pt}
  #print td,#print th{border-bottom:1px solid #999;padding:4pt;text-align:left;font-size:10pt}
  #print .tn{font-size:28pt;font-weight:900;margin:6pt 0}
}
</style>
<style>
.qr{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:22px;padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff}
.qr .code{width:150px;height:150px;display:grid;place-items:center;background:#fff}
.qr .code img,.qr .code canvas{width:150px;height:150px;image-rendering:pixelated}
.qr p{max-width:300px;text-align:left;font-size:15px}
.acct{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>

<header class="bar">
  <img src="pbg-logo.png" alt="PBG Cards & Collectibles HTX" style="height:50px;width:auto">
  <span class="sub">Card intake</span>
  <div class="right">
    <span class="pill warn" id="setupPill" hidden>Prices not set</span>
    <span class="pill" id="queuePill" hidden></span>
    <button class="icon-btn" id="staffBtn" aria-label="Staff menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<nav class="steps" id="steps" hidden aria-label="Progress"></nav>
<div id="app"></div>
<div class="foot" id="foot" hidden><div class="in" id="footIn"></div></div>
<div id="print"></div>

<script>
/* ============================================================
   PBG Cards & Collectibles HTX: iPad card intake
   Settings are edited in the app (Staff menu, PIN) and saved on
   this iPad. DEFAULTS below are placeholders until staff save.
   ============================================================ */
const DEFAULTS = {
  pin: "1234",                          // manager PIN for the Staff menu
  employees: [],                        // [{ name, hash }] 4-digit codes, stored hashed
  taxRate: 0,                           // percent, applied to the whole ticket
  // Customer price for grading = the grading company's fee + markup.
  markup: 20,                           // added to every graded card
  evalPrice: 17,                        // Full evaluation with magnification (Restored Rarity)
  prepPrice: 7,                         // Prep only: cleaning and grading prep (Restored Rarity)
  // Gem service for high-value graded cards (includes a magnetic case). Highest tier the declared value passes applies.
  gemTiers: [ { over: 4000, fee: 40 }, { over: 6000, fee: 60 }, { over: 8000, fee: 80 }, { over: 10000, fee: 100 } ],
  // Matching magnetic slab case, handed over with the slab at pickup. Graded cards only; gem cards already include one.
  magPrice: 15,
  // Profit split, saved on every order. Restored Rarity gets the rest of each add-on price.
  split: { pbgPerGrade: 12, rrPerGrade: 8, pbgPerEval: 2, pbgPerPrep: 2, pbgGemPct: 70, pbgMagPct: 100 },
  pricesChecked: "Nov 9, 2026",
  // fee = what the grading company charges per card. active:false = paused by the company (shown greyed out).
  graders: [
    { name: "PSA", tiers: [
      { name: "Value Bulk",    fee: 24.99, max: 500,   eta: "Collectors Club, 20-card minimum", active: false },
      { name: "Value",         fee: 39.99, max: 500,   eta: "About 90 to 100 business days",   active: true },
      { name: "Value Plus",    fee: 49.99, max: 500,   eta: "",                                 active: false },
      { name: "Standard",      fee: 59.99, max: 1000,  eta: "About 70 to 80 business days",     active: true },
      { name: "Value Max",     fee: 64.99, max: 1000,  eta: "",                                 active: false },
      { name: "Priority",      fee: 79.99, max: 1500,  eta: "About 50 to 60 business days",     active: true },
      { name: "Express",       fee: 199,   max: 2500,  eta: "About 20 to 30 business days",     active: true },
      { name: "Super Express", fee: 349,   max: 5000,  eta: "About 10 to 15 business days",     active: true },
      { name: "Premier",       fee: 599,   max: 10000, eta: "Fastest PSA service",              active: true } ] },
    { name: "CGC", tiers: [
      { name: "Bulk",        fee: 17,  max: 500,    eta: "About 150 working days. Ships in PBG's 25-card batch", active: true },
      { name: "Economy",     fee: 20,  max: 1000,   eta: "About 90 working days",  active: true },
      { name: "Standard",    fee: 55,  max: 3000,   eta: "About 10 working days",  active: true },
      { name: "Express",     fee: 100, max: 10000,  eta: "About 5 working days",   active: true },
      { name: "WalkThrough", fee: 300, max: 100000, eta: "About 2 working days",   active: true } ] },
    { name: "BGS", tiers: [
      { name: "Base",                 fee: 14.95,  max: 250,  eta: "No subgrades",               active: false },
      { name: "Base with subgrades",  fee: 17.95,  max: 250,  eta: "",                           active: false },
      { name: "Standard",             fee: 34.95,  max: 1000, eta: "Subgrades included",         active: false },
      { name: "Express",              fee: 79.95,  max: 2500, eta: "About 15 business days, subgrades included", active: true },
      { name: "Priority",             fee: 124.95, max: 5000, eta: "About 5 business days",      active: false } ] },
    { name: "TAG", tiers: [
      { name: "Value",    fee: 29.95,  max: 250,  eta: "About 90 business days. Ships in PBG's 10-card batch", active: true },
      { name: "Base",     fee: 39.95,  max: 500,  eta: "About 60 business days. Ships in PBG's 5-card batch",  active: true },
      { name: "Standard", fee: 59.95,  max: 1000, eta: "About 45 business days, includes TAG Score", active: true },
      { name: "Priority", fee: 79.95,  max: 1500, eta: "About 30 business days",  active: true },
      { name: "Express",  fee: 149.95, max: 2500, eta: "About 10 business days",  active: true },
      { name: "Premier",  fee: 299.95, max: 5000, eta: "About 3 to 5 business days", active: true } ] }
  ],
  terms:
`PBG CARDS & COLLECTIBLES HTX: SUBMISSION TERMS

1. GRADING. PBG Cards & Collectibles HTX ("PBG") submits cards to third-party grading companies (PSA, CGC, BGS, TAG) on your behalf. PBG is not affiliated with any grading company. Grades, authentication, labels and turnaround times are decided only by the grading company. PBG does not guarantee any grade, and is not responsible if a card grades lower than hoped, is rejected, gets no numeric grade or receives an altered/authentic-only label.

2. PRICES AND UPCHARGES. Grading prices are the grading company's fee plus PBG's $20 handling fee. Grading companies set and change their own fees, tiers and turnaround times without notice. If a grading company places a card in a higher value tier or charges an upcharge, you are responsible for that amount; PBG will contact you before you are charged. Graded cards declared above $4,000 receive PBG's gem service with a magnetic case: $40 over $4,000, $60 over $6,000, $80 over $8,000 and $100 over $10,000. Any other graded card can add a matching magnetic slab case for $15, handed to you with your slab at pickup; it is only sold with a grading submission and is non-refundable once your cards are graded.

3. DECLARED VALUES. Card values you enter are your estimate. They are used to choose the grading tier, the gem service and shipping insurance only. They are not an agreed replacement value or a guaranteed resale value. PBG may verify values and may decline any card.

4. PREP AND EVALUATIONS. Prep (cleaning and grading prep) and full evaluations with magnification are performed by Restored Rarity TCG, an independent partner of PBG, by professionals in the restoration space familiar with grading company requirements. Cards you choose these services for go from PBG to Restored Rarity and back to PBG before any grading submission. Prep is surface-level and non-invasive. An evaluation is a professional opinion, not a guaranteed grade.

5. REPAIRS. PBG is an authorized drop-off location for Restored Rarity. Repairs are a separate submission with Restored Rarity under its own Terms & Conditions. Restored Rarity quotes and bills repairs directly, and no repair is done without your approval.

6. PAYMENT. All charges, including any upcharge and holding fees, must be paid before cards are released. Fees for services already performed (prep, evaluation, grading fees paid to the grading company) are non-refundable.

7. SHIPPING AND LIABILITY. Cards travel to and from grading companies and Restored Rarity by insured carrier. PBG uses reasonable care with your cards while they are at the shop. PBG is not responsible for delays or decisions by grading companies, or for loss or damage while cards are in a carrier's or grading company's custody beyond what PBG recovers through insurance or claims, which PBG will pass on to you. PBG is not responsible for changes in market value, expected grades, lost profits or indirect damages. Nothing in these terms limits liability that cannot legally be limited under Texas law.

8. CONTACT. PBG will reach you by the phone, email and mailing address you give us. You are responsible for keeping them current and checking your messages. Notices sent to the contact information on this ticket count as notice to you.

9. PHOTOS. PBG may photograph your cards for intake records and may show the cards (never your name or personal details) on PBG's website and social media.

10. PICKUP AND UNCLAIMED CARDS (PLEASE READ).
 a. When your cards are back at PBG, we will text and/or email you that they are ready. Storage is free for 30 days after that ready notice.
 b. Starting on day 31, a holding fee of $1 per card per day applies and must be paid before the cards are released.
 c. If your cards are still not picked up 60 days after the ready notice, PBG will send a final notice by text and/or email AND by certified mail to the mailing address on this ticket. The final notice will state the amount owed and a pickup deadline at least 30 days after the notice is sent.

const DB = (() => {
  let dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try{
        const r = indexedDB.open("pbg-intake", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("subs", { keyPath: "ticket" });
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      }catch(e){ rej(e); }
    });
    return dbp;
  }
  async function tx(mode, fn){
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction("subs", mode), s = t.objectStore("subs");
      const out = fn(s);
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
    });
  }
  const mem = new Map(); // fallback if IndexedDB is unavailable
  return {
    async put(sub){ try{ await tx("readwrite", s => s.put(sub)); }catch(e){ mem.set(sub.ticket, sub); } },
    async all(){ try{ return await tx("readonly", s => s.getAll()); }catch(e){ return [...mem.values()]; } }
  };
})();

function fmtPhone(v){ const d = v.replace(/\D/g,"").slice(0,10); if(d.length<4) return d; if(d.length<7) return `${d.slice(0,3)}-${d.slice(3)}`; return `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`; }
function newTicket(){
  const n = new Date(), p = x => String(x).padStart(2,"0");
  const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let r = ""; for(let i=0;i<3;i++) r += A[Math.floor(Math.random()*A.length)];
  return `PBG-${String(n.getFullYear()).slice(2)}${p(n.getMonth()+1)}${p(n.getDate())}-${r}`;
}
function compress(file, max=1400, q=.82){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      const full = c.toDataURL("image/jpeg", q);
      const ts = Math.min(1, 360/Math.max(img.width, img.height)), tc = document.createElement("canvas");
      tc.width = Math.round(img.width*ts); tc.height = Math.round(img.height*ts); tc.getContext("2d").drawImage(img, 0, 0, tc.width, tc.height);
      res({ full, thumb: tc.toDataURL("image/jpeg", .75) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("That file isn't an image the iPad can read.")); };
    img.src = url;
  });
}
function modal(html, onMount){

  onMount && onMount(s.firstElementChild, close);

}

function graderObj(){ return settings.graders.find(g => g.name === sub.grader) || null; }
function tierObj(){ const g = graderObj(); return g ? g.tiers.find(t => t.name === sub.tier) || null : null; }
// Gem service: graded cards declared above the threshold (+fee, magnetic case included)
function gemFeeFor(value){
  let fee = 0; for(const t of (settings.gemTiers || [])) if((+value || 0) > +t.over) fee = Math.max(fee, +t.fee || 0);
  return fee;
}
const gemFee = c => (sub && sub.grader && sub.grader !== "None") ? gemFeeFor(c.value) : 0;
const isGem = c => gemFee(c) > 0;
const canMag = c => !!(sub && sub.grader && sub.grader !== "None") && !isGem(c);
const hasMag = c => !!c.mag && canMag(c);
const gemMin = () => Math.min(...(settings.gemTiers || [{ over: Infinity }]).map(t => +t.over));
const tierPrice = t => Math.round(((+t.fee || 0) + (+settings.markup || 0)) * 100) / 100;
function calc(){
  const t = tierObj(), grading = !!(sub.grader && sub.grader !== "None" && t);
  const fee = grading ? +t.fee : 0, markup = grading ? +settings.markup : 0, gradeEach = grading ? tierPrice(t) : 0;
  let gradedCards = 0, prepCount = 0, evalCount = 0, repairs = 0, gemCount = 0, gemTotal = 0, magCount = 0;
  for(const c of sub.cards){ if(grading) gradedCards++; if(c.clean) prepCount++; if(c.eval) evalCount++; if(c.repair) repairs++; const gf = gemFee(c); if(gf){ gemCount++; gemTotal += gf; } if(grading && hasMag(c)) magCount++; }
  const r2 = n => Math.round(n * 100) / 100, sp = settings.split || {};
  const gradingTotal = r2(gradeEach * gradedCards), cleaning = r2(prepCount * settings.prepPrice), evals = r2(evalCount * settings.evalPrice);
  const gems = r2(gemTotal), gemPbg = r2(gems * (+sp.pbgGemPct || 0) / 100), gemRr = r2(gems - gemPbg);
  const mags = r2(magCount * (+settings.magPrice || 0)), magPbg = r2(mags * (sp.pbgMagPct ?? 100) / 100), magRr = r2(mags - magPbg);
  const subtotal = r2(gradingTotal + cleaning + evals + gems + mags), tax = r2(subtotal * (+settings.taxRate || 0) / 100);
  const pbgShare = r2(gradedCards * sp.pbgPerGrade + evalCount * sp.pbgPerEval + prepCount * sp.pbgPerPrep + gemPbg + magPbg);
  const rrShare  = r2(gradedCards * sp.rrPerGrade + evalCount * (settings.evalPrice - sp.pbgPerEval) + prepCount * (settings.prepPrice - sp.pbgPerPrep) + gemRr + magRr);
  return { gradeEach, fee, markup, grading: gradingTotal, cleaning, evals, repairs, subtotal, tax, total: r2(subtotal + tax), count: sub.cards.length,
    gemCount, gems, magCount, mags, gradedCards, prepCount, evalCount, graderFees: r2(fee * gradedCards), markupTotal: r2(markup * gradedCards), pbgShare, rrShare };
}

/* ---------------- staff check: an employee reviews the cards and accepts them with their 4-digit code ---------------- */
async function hashCode(code){
  const data = new TextEncoder().encode("pbg-employee:" + code);
  if(window.crypto && crypto.subtle){ const buf = await crypto.subtle.digest("SHA-256", data); return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join(""); }
  let h = 0; for(const b of data) h = (h * 31 + b) >>> 0; return "x" + h.toString(16);   // fallback for non-secure pages
}
async function findEmployee(code){
  const h = await hashCode(code);
  const emp = (settings.employees || []).find(e => e.hash === h);
  if(emp) return emp.name;
  if(!(settings.employees || []).length && code === settings.pin) return "Manager";
  return null;
}

function sigPad(cv){
  const ctx = cv.getContext("2d"); let drawing = false, dirty = false, last = null;
  function size(){ const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = r.width*d; cv.height = r.height*d; ctx.scale(d,d); ctx.lineWidth = 2.6; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#141414"; }
  size();
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener("pointerdown", e => { drawing = true; dirty = true; last = pt(e); cv.setPointerCapture(e.pointerId); cv.nextElementSibling.hidden = true; });
  cv.addEventListener("pointermove", e => { if(!drawing) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last = p; });
  ["pointerup","pointercancel","pointerleave"].forEach(ev => cv.addEventListener(ev, () => drawing = false));
  return { clear(){ ctx.clearRect(0,0,cv.width,cv.height); dirty = false; cv.nextElementSibling.hidden = false; }, empty: () => !dirty, data: () => cv.toDataURL("image/png") };
}

/* ---------------- QR code (library loads from CDN, cached by the app for offline use) ---------------- */
let qrLib = null;
function loadQR(){
  if(window.qrcode) return Promise.resolve();
  return qrLib || (qrLib = new Promise((res, rej) => { const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"; sc.onload = res; sc.onerror = () => { qrLib = null; rej(); }; document.head.appendChild(sc); }));
}
async function drawQR(el, text){
  if(!el) return;
  try{ await loadQR(); const q = qrcode(0, "M"); q.addData(text); q.make(); el.innerHTML = q.createImgTag(6, 8); el.querySelector("img").alt = "QR code for your order status"; }
  catch(e){ el.innerHTML = `<span style="font-size:12px;color:var(--steel);text-align:center">QR code needs internet. Use the link on the receipt.</span>`; }
}

/* ---------------- sync to the PBG order system (Supabase) ---------------- */
async function syncOne(s){
  if(s.synced) return;
  try{
    await PBG.init();
    if(PBG.mode === "live" && !(await PBG.currentStaff())) throw new Error("The iPad isn't signed in. Open Staff > Settings and sign in.");
    if(!s.publicToken) s.publicToken = PBG.newToken();
    if(!s.synced){ await PBG.submitOrder(s); s.synced = true; }
    s.syncError = null;
  }catch(e){ s.syncError = String(e.message || e); }
  // Repair cards also go to Restored Rarity's website as their own submission
  if(s.cards.some(c => c.repair) && !s.rrSynced){
    try{ const r = await RR.pushRepairs(s); s.rrCode = r.code; s.rrLink = r.link; s.rrSynced = true; s.rrError = null;
      if(s.synced) await PBG.linkRestoredRarity(s.ticket, r.code).catch(() => {}); }
    catch(e){ s.rrError = String(e.message || e); }
  }
  await DB.put(s);
}
let syncing = false;
async function syncAll(){
  if(syncing || !navigator.onLine) return; syncing = true;
  try{ for(const s of (await DB.all()).filter(x => !x.synced || (x.cards.some(c => c.repair) && !x.rrSynced))) await syncOne(s); } finally { syncing = false; }
  refreshPills();
}
window.addEventListener("online", syncAll);
setInterval(syncAll, 2*60*1000);

    const b = e.target.closest("button"); if(!b) return;
    if(b.dataset.addt){ read(); s.graders[+b.dataset.addt].tiers.push({ name:"", fee:0, max:0, eta:"", active:true }); draw(); }
    else if(b.dataset.rmt){ read(); const [gi,ti] = b.dataset.rmt.split(":").map(Number); s.graders[gi].tiers.splice(ti,1); draw(); }
    else if(b.dataset.rmg){ read(); if(await confirmBox("Remove this grading company?", `${s.graders[+b.dataset.rmg].name} and its levels will be removed when you save.`, "Remove")){ s.graders.splice(+b.dataset.rmg,1); draw(); } }
    else if(b.id === "addG"){ read(); s.graders.push({ name:"", tiers:[{ name:"Standard", fee:0, max:0, eta:"", active:true }] }); draw(); }
    else if(b.id === "addEmp"){
      const name = $("#eName").value.trim(), code = $("#eCode").value.trim();
      if(!name){ toast("Enter the employee's name."); return; }
      if(!/^\d{4}$/.test(code)){ toast("The code needs exactly 4 digits."); return; }
      const h = await hashCode(code);
      if((settings.employees || []).some(e => e.hash === h)){ toast("Another employee already uses that code. Pick a different one."); return; }
      read(); s.employees = [...(settings.employees || []), { name, hash: h }]; settings.employees = s.employees;
      LS.set("pbg.settings", { ...LS.get("pbg.settings", {}), employees: settings.employees }); toast(`${name} added`); draw(); drawAcct();
    }
    else if(b.dataset.rme){
      const e = settings.employees[+b.dataset.rme];
      if(!await confirmBox(`Remove ${e.name}?`, "Their code will stop working on this iPad. Orders they already accepted keep their name.", "Remove")) return;
      read(); settings.employees = settings.employees.filter((_, i) => i !== +b.dataset.rme); s.employees = settings.employees;
      LS.set("pbg.settings", { ...LS.get("pbg.settings", {}), employees: settings.employees }); draw(); drawAcct();
    }
    else if(b.id === "signIn"){
      const err = $("#sErr"); err.hidden = true; b.disabled = true; b.textContent = "Signing in…";
      try{ await PBG.init(); await PBG.signIn($("#sEmail").value.trim(), $("#sPass").value); await loadPricing(); toast("Signed in"); drawAcct(); refreshPills(); syncAll(); }
      catch(x){ err.hidden = false; err.textContent = x.message; b.disabled = false; b.textContent = "Sign in"; }
    }
    else if(b.id === "signOut"){
      if(await confirmBox("Sign this iPad out?", "Submissions will stay on the iPad and won't upload until someone signs in again.", "Sign out")){ await PBG.signOut(); drawAcct(); refreshPills(); }
    }
    else if(b.id === "save"){
      read();
      if(!/^\d{4,6}$/.test(s.pin)){ toast("The PIN needs 4 to 6 digits."); return; }
      if(s.graders.some(g => !g.name || g.tiers.some(t => !t.name))){ toast("Every company and level needs a name."); return; }
      if(Math.abs(s.split.pbgPerGrade + s.split.rrPerGrade - s.markup) > 0.001){ toast(`PBG + Restored Rarity per graded card should add up to the $${s.markup} handling fee.`); return; }
      if(s.split.pbgPerEval > s.evalPrice || s.split.pbgPerPrep > s.prepPrice || s.split.pbgGemPct < 0 || s.split.pbgGemPct > 100){ toast("PBG's share can't be more than the add-on price."); return; }
      s.version = SETTINGS_VERSION;
      settings = s; settings.saved = true;
      if(!LS.set("pbg.settings", settings)){ toast("Couldn't save on this device."); return; }
      try{ await PBG.savePricing(pricingRules(settings), settings.graders); toast(PBG.mode === "live" ? "Saved. Prices updated for every iPad." : "Settings saved"); }
      catch(x){ toast("Saved on this iPad, but the order system didn't accept the prices: " + x.message); }
      syncAll();
      staff("settings");
    }
    else if(b.id === "reset"){ if(await confirmBox("Restore default settings?", "Your prices, companies, terms and manager PIN go back to the defaults. Employees are kept.", "Restore")){ const emps = settings.employees || []; settings = { ...structuredClone(DEFAULTS), employees: emps, version: SETTINGS_VERSION }; LS.set("pbg.settings", { employees: emps, version: SETTINGS_VERSION }); staff("settings"); } }
  };
}

/* ---------------- pricing from the order system ---------------- */
const PRICE_KEYS = ["markup","evalPrice","prepPrice","gemTiers","magPrice","split","pricesChecked"];
const pricingRules = s => Object.fromEntries(PRICE_KEYS.map(k => [k, s[k]]));
async function loadPricing(){
  try{
    if(PBG.mode === "live" && !(await PBG.currentStaff())) return;
    const p = await PBG.getPricing(); if(!p || !p.rules) return;
    Object.assign(settings, p.rules); if(Array.isArray(p.graders) && p.graders.length) settings.graders = p.graders;
    settings.pricingFrom = p.updated_at ? `${new Date(p.updated_at).toLocaleString()}${p.updated_by ? " by " + p.updated_by : ""}` : "";
    LS.set("pbg.settings", { ...LS.get("pbg.settings", {}), ...pricingRules(settings), graders: settings.graders, version: SETTINGS_VERSION });
  }catch(e){ /* offline: keep the last prices saved on this iPad */ }
}

/* ---------------- start ---------------- */
step = "welcome";
PBG.init().catch(e => toast(e.message)).then(loadPricing).finally(() => { render(); syncAll(); });
if("serviceWorker" in navigator && location.protocol === "https:"){ navigator.serviceWorker.register("sw.js").catch(() => {}); }
</script>
